<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦嘢 - 让梦想照进现实</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#c892d2",
                        "primary-dark": "#a05ce0",
                        "background-light": "#f7f6f7",
                        "background-dark": "#1c151d",
                        "surface-dark": "#2d1b36",
                        glass: "rgba(255, 255, 255, 0.08)",
                        "glass-border": "rgba(255, 255, 255, 0.1)"
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        body: ["Noto Sans SC", "sans-serif"]
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    backgroundImage: {
                        "starry-gradient": "radial-gradient(circle at 50% 0%, #2e1a47 0%, #1a0f23 60%, #0d0612 100%)",
                        "vortex-gradient": "radial-gradient(circle at 50% 50%, #2d1440 0%, #0a0612 100%)",
                        "star-pattern": "radial-gradient(white 1px, transparent 1px)"
                    }
                }
            }
        };
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden min-h-screen">
    
    <!-- Background Layer -->
    <div id="app-background" class="fixed inset-0 z-0 bg-starry-gradient overflow-hidden pointer-events-none">
        <div class="stars absolute inset-0 bg-star-pattern"></div>
        <div class="stars-sm absolute inset-0 bg-star-pattern"></div>
        <div class="absolute -top-[10%] -left-[10%] w-[60%] h-[60%] bg-primary/10 rounded-full vortex-blur"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[60%] h-[60%] bg-blue-600/10 rounded-full vortex-blur"></div>
    </div>
    
    <!-- Main App Container -->
    <div id="app" class="relative z-10">
        
        <!-- Page Content Container -->
        <main id="page-content" class="max-w-md mx-auto pb-32 pt-8 px-4">
            <!-- Dynamic content loaded here -->
        </main>
        
        <!-- Bottom Navigation -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 z-50">
            <div class="absolute inset-0 bg-background-dark/80 backdrop-blur-xl border-t border-glass-border"></div>
            <div class="relative flex justify-around items-end pb-5 pt-3 px-2 max-w-md mx-auto">
                <button onclick="navigateTo('home')" class="nav-item flex flex-1 flex-col items-center justify-end gap-1 group" data-page="home">
                    <span class="material-symbols-outlined text-2xl text-primary group-hover:text-white transition-colors">cloud_queue</span>
                    <span class="text-[10px] font-medium text-primary">梦嘢</span>
                </button>
                <button onclick="navigateTo('feed')" class="nav-item flex flex-1 flex-col items-center justify-end gap-1 group" data-page="feed">
                    <span class="material-symbols-outlined text-2xl text-slate-400 group-hover:text-white transition-colors">dynamic_feed</span>
                    <span class="text-[10px] font-medium text-slate-400">动态</span>
                </button>
                <button onclick="navigateTo('create')" class="relative -top-4">
                    <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-cyan-400 to-primary shadow-[0_0_20px_rgba(34,211,238,0.5)] flex items-center justify-center border-2 border-white/50 hover:scale-105 transition-transform">
                        <span class="material-symbols-outlined text-white text-3xl">add</span>
                    </div>
                </button>
                <button onclick="navigateTo('notifications')" class="nav-item flex flex-1 flex-col items-center justify-end gap-1 group" data-page="notifications">
                    <span class="material-symbols-outlined text-2xl text-slate-400 group-hover:text-white transition-colors">notifications</span>
                    <span class="text-[10px] font-medium text-slate-400">通知</span>
                </button>
                <button onclick="navigateTo('profile')" class="nav-item flex flex-1 flex-col items-center justify-end gap-1 group" data-page="profile">
                    <div id="nav-profile-avatar" class="w-7 h-7 rounded-full overflow-hidden bg-gradient-to-tr from-primary to-purple-600 flex items-center justify-center text-xs font-bold text-white border-2 border-transparent transition-all group-hover:border-white/30">
                        <span class="material-symbols-outlined text-xl text-slate-400 nav-profile-icon">person</span>
                    </div>
                    <span class="text-[10px] font-medium text-slate-400">我的</span>
                </button>
            </div>
        </nav>
        
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4"></div>
    
    <!-- JavaScript -->
    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/router.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
